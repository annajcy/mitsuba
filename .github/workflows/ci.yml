name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  conan-cmake-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            conan_cache_path: ~/.conan2
            shell: bash
          - os: ubuntu-latest
            conan_cache_path: ~/.conan2
            shell: bash
          - os: windows-latest
            conan_cache_path: ~\\.conan2
            shell: pwsh

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Conan artifacts
        uses: actions/cache@v4
        with:
          path: ${{ matrix.conan_cache_path }}
          key: ${{ runner.os }}-conan2-${{ hashFiles('conanfile.py', 'CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-conan2-

      - name: Install Conan
        run: |
          python -m pip install --upgrade pip
          python -m pip install "conan>=2.0,<3"
        shell: ${{ matrix.shell }}

      - name: Make CI script executable
        if: runner.os != 'Windows'
        run: chmod +x scripts/ci_conan_build.sh
        shell: bash

      - name: Build (Conan + CMake) - macOS/Linux
        if: runner.os != 'Windows'
        run: scripts/ci_conan_build.sh Release
        shell: bash

      - name: Build (Conan + CMake) - Windows
        if: runner.os == 'Windows'
        run: ./scripts/ci_conan_build.ps1 Release
        shell: pwsh
